services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Vui lòng đặt POSTGRES_USER trong file .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Vui lòng đặt POSTGRES_PASSWORD trong file .env}
      POSTGRES_DB: ${POSTGRES_DB:-abc_office}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # host 5433 to avoid clashing with a Postgres already running on the host at 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vua1} -d ${POSTGRES_DB:-abc_office}"]
      interval: 5s
      timeout: 5s
      retries: 10

  be:
    build:
      context: ./be
      target: production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-abc_office}?schema=public
      PORT: 5000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Vui lòng đặt JWT_ACCESS_SECRET trong file .env}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES_DAYS: ${JWT_REFRESH_EXPIRES_DAYS:-7}
      # MinIO Config for Backend
      MINIO_ENDPOINT: minio
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-abc-office}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
    ports:
      - "5000:5000"
    # Migration + seed + start: dùng CMD có sẵn trong Dockerfile (be/Dockerfile),
    # tránh lặp lại path dist/* dễ lệch khi cấu trúc build output thay đổi.

  fe:
    build:
      context: ./fe
      target: production
      args:
        # Pass runtime env vars as build-time args for Next.js to bake them in
        BE_API_URL: http://be:5000
        NEXT_PUBLIC_MINIO_PUBLIC_URL: http://localhost:${MINIO_PORT:-9000}/${MINIO_BUCKET:-abc-office}
    restart: unless-stopped
    depends_on:
      - be
    environment:
      BE_API_URL: http://be:5000
      NEXT_PUBLIC_MINIO_PUBLIC_URL: http://localhost:${MINIO_PORT:-9000}/${MINIO_BUCKET:-abc-office}
      PORT: 3000
      NODE_ENV: production
      # Kích hoạt Node.js Inspector để debug
      NODE_OPTIONS: --inspect=0.0.0.0:9229 --dns-result-order=ipv4first
    ports:
      - "3000:3000"
      - "9229:9229" # Cổng debug cho Node.js Inspector

  minio:
    image: minio/minio:latest
    container_name: abc-office-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"       # API port
      - "9001:9001"       # Console port
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Vui lòng đặt MINIO_ROOT_USER trong file .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Vui lòng đặt MINIO_ROOT_PASSWORD trong file .env}
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
